suite: deployment
release:
  name: mpchess
templates:
  - templates/deployment.yaml
tests:
  - it: default values render correctly
    asserts:
      - isKind:
          of: Deployment
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: mpchess
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: mpchess:latest
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: MPCHESS_PORT
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "3000"
      - isNull:
          path: spec.template.spec.containers[0].args
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp
      - isNull:
          path: spec.template.spec.volumes[0].configMap
      - isNull:
          path: spec.template.spec.volumes[0].secret

  - it: respects custom image repository and tag
    set:
      image:
        repository: myregistry/mpchess
        tag: v1.2.3
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myregistry/mpchess:v1.2.3
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: TLS enabled adds env vars, volume mounts, and HTTPS probes
    set:
      tls:
        enabled: true
        secretName: my-tls-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_CERT
            value: /etc/tls/tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_KEY
            value: /etc/tls/tls.key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /etc/tls/tls.crt
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: tls.crt
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].mountPath
          value: /etc/tls/tls.key
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].subPath
          value: tls.key
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp
      - equal:
          path: spec.template.spec.volumes[1].name
          value: tls
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: my-tls-secret
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: https
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: https
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: https

  - it: config enabled adds config volume mount
    set:
      config:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /app/config.jsonc
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: config.jsonc
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp
      - equal:
          path: spec.template.spec.volumes[1].name
          value: config

  - it: TLS and config together adds both volume mounts
    set:
      tls:
        enabled: true
        secretName: my-tls
      config:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 4
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3

  - it: custom server port changes env var and containerPort
    set:
      server:
        port: 8443
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "8443"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8443

  - it: custom FEN adds MPCHESS_FEN env var
    set:
      server:
        fen: "4k3/8/8/8/8/8/8/4K2R w K - 0 1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_FEN
            value: "4k3/8/8/8/8/8/8/4K2R w K - 0 1"

  - it: allowedOrigins adds MPCHESS_ALLOWED_ORIGINS env var
    set:
      server:
        allowedOrigins: "chess.example.com,localhost"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_ALLOWED_ORIGINS
            value: "chess.example.com,localhost"

  - it: debug adds MPCHESS_DEBUG env var
    set:
      server:
        debug: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_DEBUG
            value: "true"

  - it: has liveness and readiness probes with HTTP scheme by default
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: default security context is applied to pod and container
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 100
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 101
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 101
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: security context can be disabled
    set:
      securityContext:
        enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.securityContext
      - isNull:
          path: spec.template.spec.containers[0].securityContext

  - it: security context can be customized
    set:
      securityContext:
        enabled: true
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: has standard labels
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  - it: selector matchLabels match pod template labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: mpchess
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: mpchess

  - it: initHalfmoveClock adds MPCHESS_INIT_HALFMOVE_CLOCK env var
    set:
      server:
        initHalfmoveClock: 98
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_INIT_HALFMOVE_CLOCK
            value: "98"

  - it: initHalfmoveClock env var is absent when unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_INIT_HALFMOVE_CLOCK

  # ── New server settings (Feature #6 / D4) ──

  - it: default host env var is rendered
    set:
      server:
        host: "0.0.0.0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_HOST
            value: "0.0.0.0"

  - it: custom host overrides default
    set:
      server:
        host: "127.0.0.1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_HOST
            value: "127.0.0.1"

  - it: seatTimeout adds MPCHESS_SEAT_TIMEOUT env var
    set:
      server:
        seatTimeout: 120000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SEAT_TIMEOUT
            value: "120000"

  - it: joinTimeout adds MPCHESS_JOIN_TIMEOUT env var
    set:
      server:
        joinTimeout: 10000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_JOIN_TIMEOUT
            value: "10000"

  - it: rateLimitMax adds MPCHESS_RATE_LIMIT_MAX env var
    set:
      server:
        rateLimitMax: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_RATE_LIMIT_MAX
            value: "100"

  - it: rateLimitWindow adds MPCHESS_RATE_LIMIT_WINDOW env var
    set:
      server:
        rateLimitWindow: 5000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_RATE_LIMIT_WINDOW
            value: "5000"

  - it: slowClientThreshold adds MPCHESS_SLOW_CLIENT_THRESHOLD env var
    set:
      server:
        slowClientThreshold: 2097152
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SLOW_CLIENT_THRESHOLD
            value: "2097152"

  - it: minMoveDelay adds MPCHESS_MIN_MOVE_DELAY env var
    set:
      server:
        minMoveDelay: 1000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_MIN_MOVE_DELAY
            value: "1000"

  - it: computerPlayer.enabled adds MPCHESS_COMPUTER_ENABLED env var
    set:
      server:
        computerPlayer:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
            value: "true"

  - it: computerPlayer.enabled=false adds MPCHESS_COMPUTER_ENABLED env var
    set:
      server:
        computerPlayer:
          enabled: false
          stockfishPath: ""
          spawnTimeout: 10000
          moveTimeout: 30000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
            value: "false"

  - it: computerPlayer.stockfishPath adds MPCHESS_COMPUTER_STOCKFISH_PATH env var
    set:
      server:
        computerPlayer:
          stockfishPath: "/usr/bin/stockfish"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_STOCKFISH_PATH
            value: "/usr/bin/stockfish"

  - it: computerPlayer.spawnTimeout adds MPCHESS_COMPUTER_SPAWN_TIMEOUT env var
    set:
      server:
        computerPlayer:
          spawnTimeout: 15000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
            value: "15000"

  - it: computerPlayer.moveTimeout adds MPCHESS_COMPUTER_MOVE_TIMEOUT env var
    set:
      server:
        computerPlayer:
          moveTimeout: 60000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_MOVE_TIMEOUT
            value: "60000"

  - it: computerPlayer.skills adds MPCHESS_COMPUTER_SKILLS env var as JSON
    set:
      server:
        computerPlayer:
          skills:
            beginner:
              movetime: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SKILLS
            value: "{\"beginner\":{\"movetime\":100}}"

  - it: all new server settings rendered together
    set:
      server:
        host: "127.0.0.1"
        seatTimeout: 120000
        joinTimeout: 10000
        rateLimitMax: 100
        rateLimitWindow: 5000
        slowClientThreshold: 2097152
        minMoveDelay: 1000
        computerPlayer:
          enabled: true
          stockfishPath: "/usr/bin/stockfish"
          spawnTimeout: 15000
          moveTimeout: 60000
          skills:
            beginner:
              movetime: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_HOST
            value: "127.0.0.1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SEAT_TIMEOUT
            value: "120000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_JOIN_TIMEOUT
            value: "10000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_RATE_LIMIT_MAX
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_RATE_LIMIT_WINDOW
            value: "5000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SLOW_CLIENT_THRESHOLD
            value: "2097152"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_MIN_MOVE_DELAY
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_STOCKFISH_PATH
            value: "/usr/bin/stockfish"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
            value: "15000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_MOVE_TIMEOUT
            value: "60000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SKILLS
            value: '{"beginner":{"movetime":100}}'

  # ── Zero-value tests (truthiness → key-presence fix) ──

  - it: minMoveDelay zero renders as "0"
    set:
      server:
        minMoveDelay: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_MIN_MOVE_DELAY
            value: "0"

  - it: rateLimitMax zero renders as "0"
    set:
      server:
        rateLimitMax: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_RATE_LIMIT_MAX
            value: "0"

  - it: seatTimeout zero renders as "0"
    set:
      server:
        seatTimeout: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SEAT_TIMEOUT
            value: "0"

  - it: slowClientThreshold zero renders as "0"
    set:
      server:
        slowClientThreshold: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_SLOW_CLIENT_THRESHOLD
            value: "0"

  - it: computerPlayer.spawnTimeout zero renders as "0"
    set:
      server:
        computerPlayer:
          enabled: true
          stockfishPath: ""
          spawnTimeout: 0
          moveTimeout: 30000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
            value: "0"

  - it: computerPlayer.moveTimeout zero renders as "0"
    set:
      server:
        computerPlayer:
          enabled: true
          stockfishPath: ""
          spawnTimeout: 10000
          moveTimeout: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_MOVE_TIMEOUT
            value: "0"

  # ── Partial computerPlayer tests (hasKey guards) ──

  - it: partial computerPlayer with only moveTimeout renders only that env var
    set:
      server:
        computerPlayer:
          moveTimeout: 60000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_MOVE_TIMEOUT
            value: "60000"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_STOCKFISH_PATH
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SKILLS

  - it: partial computerPlayer with only spawnTimeout renders only that env var
    set:
      server:
        computerPlayer:
          spawnTimeout: 15000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
            value: "15000"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_MOVE_TIMEOUT

  - it: computerPlayer.enabled=false renders enabled as "false"
    set:
      server:
        computerPlayer:
          enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_ENABLED
            value: "false"

  - it: computerPlayer.stockfishPath empty string renders as empty
    set:
      server:
        computerPlayer:
          stockfishPath: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_STOCKFISH_PATH
            value: ""

  - it: computerPlayer.skills empty object renders as empty JSON
    set:
      server:
        computerPlayer:
          skills: {}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_COMPUTER_SKILLS
            value: "{}"

  - it: host empty string renders as empty
    set:
      server:
        host: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MPCHESS_HOST
            value: ""
