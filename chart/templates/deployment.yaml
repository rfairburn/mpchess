apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mpchess.fullname" . }}
  labels:
    {{- include "mpchess.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mpchess.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mpchess.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ include "mpchess.portName" . }}
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: MPCHESS_PORT
              value: {{ .Values.server.port | toString | quote }}
            {{- if .Values.server.fen }}
            - name: MPCHESS_FEN
              value: {{ .Values.server.fen | quote }}
            {{- end }}
            {{- if .Values.server.initHalfmoveClock }}
            - name: MPCHESS_INIT_HALFMOVE_CLOCK
              value: {{ .Values.server.initHalfmoveClock | toString | quote }}
            {{- end }}
            {{- if .Values.server.allowedOrigins }}
            - name: MPCHESS_ALLOWED_ORIGINS
              value: {{ .Values.server.allowedOrigins | quote }}
            {{- end }}
            {{- if and .Values.server.prefix (ne .Values.server.prefix "/") }}
            - name: MPCHESS_PREFIX
              value: {{ .Values.server.prefix | quote }}
            {{- end }}
            {{- if .Values.server.debug }}
            - name: MPCHESS_DEBUG
              value: {{ .Values.server.debug | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "host" }}
            - name: MPCHESS_HOST
              value: {{ .Values.server.host | quote }}
            {{- end }}
            {{- if hasKey .Values.server "seatTimeout" }}
            - name: MPCHESS_SEAT_TIMEOUT
              value: {{ .Values.server.seatTimeout | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "joinTimeout" }}
            - name: MPCHESS_JOIN_TIMEOUT
              value: {{ .Values.server.joinTimeout | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "rateLimitMax" }}
            - name: MPCHESS_RATE_LIMIT_MAX
              value: {{ .Values.server.rateLimitMax | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "rateLimitWindow" }}
            - name: MPCHESS_RATE_LIMIT_WINDOW
              value: {{ .Values.server.rateLimitWindow | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "slowClientThreshold" }}
            - name: MPCHESS_SLOW_CLIENT_THRESHOLD
              value: {{ printf "%d" (int64 .Values.server.slowClientThreshold) | quote }}
            {{- end }}
            {{- if hasKey .Values.server "minMoveDelay" }}
            - name: MPCHESS_MIN_MOVE_DELAY
              value: {{ .Values.server.minMoveDelay | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "connectionRateLimitMax" }}
            - name: MPCHESS_CONNECTION_RATE_LIMIT_MAX
              value: {{ .Values.server.connectionRateLimitMax | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "connectionRateLimitWindow" }}
            - name: MPCHESS_CONNECTION_RATE_LIMIT_WINDOW
              value: {{ .Values.server.connectionRateLimitWindow | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server "computerPlayer" }}
            {{- if hasKey .Values.server.computerPlayer "enabled" }}
            - name: MPCHESS_COMPUTER_ENABLED
              value: {{ .Values.server.computerPlayer.enabled | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server.computerPlayer "stockfishPath" }}
            - name: MPCHESS_COMPUTER_STOCKFISH_PATH
              value: {{ .Values.server.computerPlayer.stockfishPath | quote }}
            {{- end }}
            {{- if hasKey .Values.server.computerPlayer "spawnTimeout" }}
            - name: MPCHESS_COMPUTER_SPAWN_TIMEOUT
              value: {{ .Values.server.computerPlayer.spawnTimeout | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server.computerPlayer "moveTimeout" }}
            - name: MPCHESS_COMPUTER_MOVE_TIMEOUT
              value: {{ .Values.server.computerPlayer.moveTimeout | toString | quote }}
            {{- end }}
            {{- if hasKey .Values.server.computerPlayer "skills" }}
            - name: MPCHESS_COMPUTER_SKILLS
              value: {{ .Values.server.computerPlayer.skills | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: MPCHESS_CERT
              value: "/etc/tls/tls.crt"
            - name: MPCHESS_KEY
              value: "/etc/tls/tls.key"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ include "mpchess.portName" . }}
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ include "mpchess.portName" . }}
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.enabled }}
            - name: config
              mountPath: /app/config.jsonc
              subPath: config.jsonc
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/tls/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: tls
              mountPath: /etc/tls/tls.key
              subPath: tls.key
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.enabled }}
        - name: config
          configMap:
            name: {{ include "mpchess.fullname" . }}-config
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
